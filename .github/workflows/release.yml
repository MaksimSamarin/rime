name: Publish Rime release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true

permissions:
  contents: write

concurrency:
  group: rime-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install release tooling
        run: python -m pip install cryptography==43.0.3
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import ast, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          tree = ast.parse(Path('app/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(v, ast.Name) and v.id == '__version__' for v in n.targets))
          assert tag == 'v' + version
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RIME_VERSION=' + version + '\n')
              output.write('RIME_REVISION=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
          PY
      - name: Build the release image
        run: docker build --build-arg RIME_VERSION="$RIME_VERSION" --build-arg RIME_REVISION="$RIME_REVISION" --tag "rime:$RIME_VERSION" .
      - name: Build the qualified native runtime
        run: docker build --target node-source --build-arg RIME_VERSION="$RIME_VERSION" --build-arg RIME_REVISION="$RIME_REVISION" --tag "rime-node:$RIME_VERSION" .
      - name: Verify backend and frontend
        run: |
          docker run --rm --network none --mount "type=bind,src=$PWD/tests,dst=/code/tests,readonly" --mount "type=bind,src=$PWD/.github,dst=/code/.github,readonly" --entrypoint python "rime:$RIME_VERSION" -m unittest discover -s /code/tests -p 'test_*.py' -q
          node --test tests/*.test.cjs
          docker run --rm --network none -v "$PWD/tests:/code/tests:ro" --entrypoint python "rime:$RIME_VERSION" /code/tests/relay_metering.py
          docker run --rm --network none -v "$PWD/tests:/code/tests:ro" --entrypoint python "rime:$RIME_VERSION" /code/tests/reality_compat.py
      - name: Verify transactional update and rollback
        run: python tests/update_integration.py --image "rime:$RIME_VERSION" --work "$RUNNER_TEMP/update-lab"
      - name: Export release assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RIME_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/rime-release-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          python scripts/export_node.py --image "rime-node:$RIME_VERSION" --output dist
          python scripts/export_release.py --version "$RIME_VERSION" --revision "$RIME_REVISION" --output dist --signing-key "$key"
      - name: Publish the verified image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Rime $RIME_VERSION" --notes-file "docs/RELEASE-$RIME_VERSION.md"
          fi
          gh release upload "$RELEASE_TAG" dist/rime-linux-amd64.tar.gz dist/SHA256SUMS --clobber
          gh release upload "$RELEASE_TAG" dist/rime-node-*-linux-amd64.tar.gz dist/rime-node-runtime.json dist/rime-node-SHA256SUMS --clobber
          gh release upload "$RELEASE_TAG" dist/rime-release.sig --clobber
          gh release upload "$RELEASE_TAG" dist/rime-release.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
