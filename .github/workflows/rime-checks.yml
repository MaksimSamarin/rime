name: Rime checks
on:
  push:
    branches: ['feat/**', 'rime/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-panel.txt -c requirements.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q hy2bridge app main.py panel_entry.py
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/monitoring.test.cjs
      - run: node --check hy2bridge/web/console.js && node --check hy2bridge/web/app.js && node --check hy2bridge/web/monitoring.js
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rime:check .
      - name: Start an isolated fresh database
        run: docker run -d --name rime-ci --network none -e SQLALCHEMY_DATABASE_URL=sqlite:////tmp/rime.db rime:check
      - name: Check migrations, console redirects and subscription icons
        run: |
          docker exec rime-ci python -c '
          import time, urllib.request
          http=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  assert b"Rime" in http.open("http://127.0.0.1:8000/fleet",timeout=2).read()
                  assert b"Rime" in http.open("http://127.0.0.1:8000/dashboard/",timeout=2).read()
                  assert b"Rime" in http.open("http://127.0.0.1:8000/dashboard/users",timeout=2).read()
                  icon=http.open("http://127.0.0.1:8000/statics/favicon/rime.svg",timeout=2)
                  assert icon.headers.get_content_type()=="image/svg+xml" and b"<svg" in icon.read()
                  from pathlib import Path
                  assert not Path("/code/app/dashboard").exists()
                  print("Fresh database and Rime pages are ready")
                  break
              except Exception:
                  if attempt==59: raise
                  time.sleep(1)
          '
      - name: Verify console user creation and subscriptions
        run: |
          docker run --rm --network none --cpus 1 --memory 512m --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,size=128m --tmpfs /suite:rw,nosuid,size=64m \
            -v "${PWD}/tests:/tests:ro" \
            -e LAB_SUITE_ROOT=/suite -e RUN_ID=console-creation \
            -e XRAY_TEST_BINARY=/usr/local/bin/xray -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python rime:check /tests/console_creation.py
      - name: Verify UI compatibility routes and CLI aliases
        run: |
          docker run --rm --network none --cpus 1 --memory 512m --cap-drop ALL \
            --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,size=128m \
            -v "${PWD}/tests:/tests:ro" -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python rime:check /tests/ui_routes.py
      - if: failure()
        run: docker logs rime-ci
