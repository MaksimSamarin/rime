name: Rime checks
on:
  push:
    branches: ['feat/**', 'rime/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -c requirements.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q hy2bridge app update_runtime relay-runtime scripts main.py panel_entry.py
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: |
          for file in hy2bridge/web/*.js; do
            node --check "$file"
          done
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag rime:check .
      - name: Verify the packaged backend
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/tests,dst=/code/tests,readonly" \
            --mount "type=bind,src=$PWD/.github,dst=/code/.github,readonly" \
            --entrypoint python rime:check -m unittest discover -s /code/tests -p 'test_*.py' -q
      - name: Start an isolated fresh database
        run: docker run -d --name rime-ci --network none -e SQLALCHEMY_DATABASE_URL=sqlite:////tmp/rime.db rime:check
      - name: Check migrations, console redirects and subscription icons
        run: |
          docker exec rime-ci python -c '
          import time, urllib.request
          http=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for attempt in range(60):
              try:
                  assert b"Rime" in http.open("http://127.0.0.1:8000/fleet",timeout=2).read()
                  assert b"Rime" in http.open("http://127.0.0.1:8000/dashboard/",timeout=2).read()
                  assert b"Rime" in http.open("http://127.0.0.1:8000/dashboard/users",timeout=2).read()
                  icon=http.open("http://127.0.0.1:8000/statics/favicon/rime.svg",timeout=2)
                  assert icon.headers.get_content_type()=="image/svg+xml" and b"<svg" in icon.read()
                  from pathlib import Path
                  assert not Path("/code/app/dashboard").exists()
                  print("Fresh database and Rime pages are ready")
                  break
              except Exception:
                  if attempt==59: raise
                  time.sleep(1)
          '
      - name: Verify console user creation and subscriptions
        run: |
          docker run --rm --network none --cpus 1 --memory 512m --pids-limit 256 \
            --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,nosuid,size=128m --tmpfs /suite:rw,nosuid,size=64m \
            -v "${PWD}/tests:/tests:ro" \
            -e LAB_SUITE_ROOT=/suite -e RUN_ID=console-creation \
            -e XRAY_TEST_BINARY=/usr/local/bin/xray -e XRAY_HUB_TEST_BINARY=/opt/rime-hub/xray \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python rime:check /tests/console_creation.py
      - name: Verify UI compatibility routes and CLI aliases
        run: |
          docker run --rm --network none --cpus 1 --memory 512m --cap-drop ALL \
            --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,size=128m \
            -v "${PWD}/tests:/tests:ro" -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python rime:check /tests/ui_routes.py
      - if: failure()
        run: docker logs rime-ci
      - name: Verify update and rollback without external routes
        run: python tests/update_integration.py --image rime:check --work "$RUNNER_TEMP/rime-update-lab"
      - name: Verify forwarding counter generations
        run: docker run --rm --network none -v "${PWD}/tests:/code/tests:ro" --entrypoint python rime:check /code/tests/relay_metering.py
      - name: Verify REALITY clients and native runtime
        run: docker run --rm --network none -v "${PWD}/tests:/code/tests:ro" --entrypoint python rime:check /code/tests/reality_compat.py
